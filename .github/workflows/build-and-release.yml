name: Build, Release & Docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: wallet-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io

jobs:
  # ==============================================================================
  # JOB 1: COMMON FRONTEND + JAVA BUILD
  # ==============================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Frontend Build ---
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: "11.24.0"
          working-directory: frontend
          install: false
          cache: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate PWA types and lint
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm lint

      - name: Test PWA units and integrations
        working-directory: frontend
        run: |
          pnpm test
          pnpm test:assets

      - name: Build frontend
        working-directory: frontend
        run: pnpm --filter ./apps/web build

      - name: Install Chromium and Firefox for PWA E2E
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Test production PWA in Chromium
        working-directory: frontend
        env:
          WALLET_E2E_PRODUCTION: "1"
        run: pnpm test:e2e

      - name: Test production PWA cross-browser smoke in Firefox
        working-directory: frontend
        env:
          WALLET_E2E_PRODUCTION: "1"
          WALLET_E2E_CROSS_BROWSER: "1"
        run: pnpm test:e2e

      - name: Synchronize and verify generated PWA assets
        working-directory: frontend
        run: |
          pnpm sync:static
          pnpm check:static

      # --- Backend Build ---
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "25.0.4.1"

      - name: Prepare verified public CryptoJ and RLP releases
        run: |
          python3 tools/prepare-local-maven-artifacts.py \
            --output /tmp/goldenera-wallet-public-maven-releases.tar
          mkdir -p ~/.m2/repository
          tar -xf /tmp/goldenera-wallet-public-maven-releases.tar -C ~/.m2/repository

      - name: Create settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers>" > ~/.m2/settings.xml
          echo "<server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-merkletrie</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-rlp</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-cryptoj</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "</servers></settings>" >> ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        run: ./mvnw clean verify -B -T 1C -s ~/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find Main JAR
        id: find_jar
        run: |
          JAR_FILE=$(find target/ -type f -name "goldenera-wallet-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_ENV

      - name: Verify packaged production PWA bytes
        run: python3 src/test/verify_packaged_pwa.py --jar "$jar_file"

      - name: Upload verified JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-jar
          path: ${{ env.jar_file }}
          if-no-files-found: error
          retention-days: 1
          archive: true

  # ==============================================================================
  # JOB 2: GITHUB RELEASE (DEFAULT BRANCHES + VERSION TAGS ONLY)
  # ==============================================================================
  release:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download verified JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallet-jar
          path: /tmp/wallet-release
          skip-decompress: false
          digest-mismatch: error

      - name: Find downloaded JAR
        run: |
          JAR_FILE=$(find /tmp/wallet-release -type f -name "goldenera-wallet-*.jar" | head -n 1)
          test -n "$JAR_FILE"
          echo "jar_file=$JAR_FILE" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.build.outputs.version }}" >> "$GITHUB_ENV"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_ENV
          else
            echo "release_exists=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing release
        if: env.release_exists == 'true'
        run: gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "GoldenEra Wallet v${{ env.VERSION }}" \
            --generate-notes \
            "${{ env.jar_file }}#goldenera-wallet.jar"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==============================================================================
  # JOB 3: BUILD IMAGES (NATIVE MATRIX: AMD64 + ARM64)
  # ==============================================================================
  build-images:
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare verified public CryptoJ and RLP releases
        run: |
          python3 tools/prepare-local-maven-artifacts.py \
            --output /tmp/goldenera-wallet-public-maven-releases.tar
          echo "LOCAL_MAVEN_ARTIFACTS_SHA256=$(sha256sum /tmp/goldenera-wallet-public-maven-releases.tar | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Lowercase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,suffix=-${{ matrix.arch }}

      - name: Build and push by digest
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            LOCAL_MAVEN_ARTIFACTS_SHA256=${{ env.LOCAL_MAVEN_ARTIFACTS_SHA256 }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          secret-files: |
            local_maven_artifacts=/tmp/goldenera-wallet-public-maven-releases.tar
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          archive: true

  # ==============================================================================
  # JOB 4: MERGE MANIFESTS
  # ==============================================================================
  merge-images:
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Normalize image tags to lowercase
        run: |
          NORMALIZED_TAGS=$(jq -c '[.tags[] | ascii_downcase]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          test "$(jq 'length' <<< "$NORMALIZED_TAGS")" -gt 0
          echo "NORMALIZED_TAGS=$NORMALIZED_TAGS" >> "$GITHUB_ENV"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr 'map("-t " + .) | join(" ")' <<< "$NORMALIZED_TAGS") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          PRIMARY_TAG=$(jq -r '.[0]' <<< "$NORMALIZED_TAGS")
          docker buildx imagetools inspect "$PRIMARY_TAG"
