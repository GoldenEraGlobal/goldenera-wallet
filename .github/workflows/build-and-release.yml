name: Build, verify, and publish

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

# Keep the legacy group during rollout so a pre-change run for the same ref
# cannot overlap this workflow's package/release writers.
concurrency:
  group: wallet-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  BUILDX_VERSION: v0.25.0
  CONSUMED_RELEASE_VERSION: 0.0.1

jobs:
  build:
    name: Build and verify once
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      image_name: ${{ steps.identity.outputs.image_name }}
      jar_name: ${{ steps.artifact.outputs.jar_name }}
      jar_sha256: ${{ steps.artifact.outputs.jar_sha256 }}
      publish_mode: ${{ steps.identity.outputs.publish_mode }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_branch: ${{ steps.identity.outputs.source_branch }}
      source_epoch: ${{ steps.identity.outputs.source_epoch }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven
          server-id: github-cryptoj

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the pinned workflow policy parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate workflow publication policy
        run: python3 tools/verify-workflow-ref-policy.py

      - name: Override mutable Maven package copies with verified releases
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/goldenera-wallet-public-maven-releases.tar"
          python3 tools/prepare-local-maven-artifacts.py --output "$archive"
          mkdir -p "$HOME/.m2/repository"
          tar -xf "$archive" -C "$HOME/.m2/repository"

      - name: Resolve immutable build identity and publication policy
        id: identity
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          REPOSITORY: ${{ github.repository }}
        run: tools/resolve-build-identity.sh

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Regenerate the API client and reject drift
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend generate
          git diff --exit-code -- frontend/packages/api/openapi.json frontend/packages/api/src
          drift="$(git status --porcelain=v1 --untracked-files=all -- frontend/packages/api/openapi.json frontend/packages/api/src)"
          [[ -z "$drift" ]] || {
            printf 'Generated API client has tracked or untracked drift:\n%s\n' "$drift" >&2
            exit 1
          }

      - name: Verify frontend source
        run: |
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          pnpm --dir frontend test:assets

      - name: Build production PWA and reject static drift
        run: |
          pnpm --dir frontend build
          pnpm --dir frontend check:static

      - name: Install the production browser test runtimes
        run: pnpm --dir frontend exec playwright install --with-deps chromium firefox

      - name: Exercise the built PWA in Chromium
        id: chromium
        env:
          WALLET_E2E_PRODUCTION: '1'
        run: pnpm --dir frontend test:e2e

      - name: Upload Chromium failure diagnostics
        if: failure() && steps.chromium.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-e2e-failure-${{ github.sha }}
          path: |
            /tmp/goldenera-wallet-e2e-results.json
            /tmp/goldenera-wallet-e2e-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Smoke the built PWA in Firefox
        env:
          WALLET_E2E_CROSS_BROWSER: '1'
          WALLET_E2E_PRODUCTION: '1'
        run: timeout --signal=TERM 5m pnpm --dir frontend test:e2e

      - name: Build, test, and reproduce the backend JAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_epoch }}
        run: |
          set -euo pipefail
          build_once() {
            ./mvnw -B -ntp -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" clean verify
          }
          find_one_jar() {
            find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print
          }

          build_once
          mapfile -t first_jars < <(find_one_jar)
          [[ "${#first_jars[@]}" -eq 1 ]] || exit 1
          first_jar="$RUNNER_TEMP/first-reproducible-build.jar"
          install -m 0644 "${first_jars[0]}" "$first_jar"
          first_sha256="$(sha256sum "$first_jar" | awk '{print $1}')"

          build_once
          mapfile -t second_jars < <(find_one_jar)
          [[ "${#second_jars[@]}" -eq 1 ]] || exit 1
          second_sha256="$(sha256sum "${second_jars[0]}" | awk '{print $1}')"
          [[ "$second_sha256" == "$first_sha256" ]] || {
            echo 'Same-commit JAR builds differ despite the fixed commit-derived output timestamp.' >&2
            exit 1
          }

      - name: Reject backend-to-frontend OpenAPI drift
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = Path('target/wallet-openapi-boot4.json')
          tracked = Path('frontend/packages/api/openapi.json')
          if not generated.is_file():
              raise AssertionError('Maven verification did not export the current Springdoc contract')
          if json.loads(generated.read_text()) != json.loads(tracked.read_text()):
              raise AssertionError('Tracked frontend OpenAPI differs from the verified backend contract')
          print('PASS: backend Springdoc and tracked frontend OpenAPI match semantically')
          PY

      - name: Verify dist, static resources, and packaged JAR bytes
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          [[ "${#jars[@]}" -eq 1 ]] || {
            printf 'Expected one production JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          }
          jar="${jars[0]}"
          python3 src/test/verify_packaged_pwa.py --jar "$jar" --report target/pwa-artifact-report.json
          jar_sha256="$(sha256sum "$jar" | awk '{print $1}')"
          [[ "$jar_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  %s\n' "$jar_sha256" "$(basename "$jar")" > target/wallet-jar.sha256
          {
            echo "jar_name=$(basename "$jar")"
            echo "jar_sha256=$jar_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the exact verified JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-jar-${{ steps.identity.outputs.commit_sha }}
          path: |
            target/${{ steps.artifact.outputs.jar_name }}
            target/wallet-jar.sha256
            target/pwa-artifact-report.json
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Build linux/${{ matrix.arch }} image
    if: needs.build.outputs.publish_mode != 'none'
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallet-jar-${{ needs.build.outputs.commit_sha }}
          path: ${{ runner.temp }}/wallet-artifact

      - name: Create an artifact-only image context
        id: context
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.jar_sha256 }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/wallet-artifact/$JAR_NAME"
          [[ -f "$artifact" && ! -L "$artifact" ]] || {
            echo 'Verified JAR artifact is missing or is a symlink.' >&2
            exit 1
          }
          actual_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || {
            echo 'Downloaded JAR does not match the build-job SHA-256.' >&2
            exit 1
          }

          context="$RUNNER_TEMP/wallet-image-context"
          rm -rf "$context"
          mkdir -p "$context"
          install -m 0644 Dockerfile "$context/Dockerfile"
          install -m 0644 "$artifact" "$context/app.jar"
          mapfile -t files < <(find "$context" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${files[*]}" == 'Dockerfile app.jar' ]] || {
            echo 'Image context must contain only Dockerfile and app.jar.' >&2
            exit 1
          }
          echo "path=$context" >> "$GITHUB_OUTPUT"
      - name: Set up pinned BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck publication policy immediately before package write
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          MODE: ${{ needs.build.outputs.publish_mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ needs.build.outputs.source_branch }}
          VERSION: ${{ needs.build.outputs.version }}
        run: tools/recheck-publishing-ref.sh

      - name: Build and push this platform by digest
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ steps.context.outputs.path }}
          build-args: SOURCE_DATE_EPOCH=${{ needs.build.outputs.source_epoch }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.build.outputs.commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            global.goldenera.wallet.jar.sha256=${{ needs.build.outputs.jar_sha256 }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Verify platform, identity, JAR, provenance, and SBOM
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_JAR_SHA256: ${{ needs.build.outputs.jar_sha256 }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          REGISTRY_HOST: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$ARCH" == 'amd64' || "$ARCH" == 'arm64' ]] || {
            echo "Unsupported native image architecture: $ARCH" >&2
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Build did not return a canonical image digest.' >&2
            exit 1
          }

          root_manifest="$RUNNER_TEMP/platform-root.json"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$root_manifest"
          jq -e --arg arch "$ARCH" '
            .schemaVersion == 2 and
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length) == 1 and
            ([.manifests[] | select(
              .platform.os == "unknown" and
              .platform.architecture == "unknown" and
              .annotations["vnd.docker.reference.type"] == "attestation-manifest"
            )] | length) == 1
          ' "$root_manifest" > /dev/null || {
            echo 'Platform root is not the expected runnable-plus-attestation OCI index:' >&2
            cat "$root_manifest" >&2
            exit 1
          }

          image_digest="$(jq -er --arg arch "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$root_manifest")"
          attestation_digest="$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$root_manifest")"
          linked_digest="$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .annotations["vnd.docker.reference.digest"]' "$root_manifest")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ && "$attestation_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Platform index returned a non-canonical runnable or attestation digest.' >&2
            exit 1
          }
          [[ "$linked_digest" == "$image_digest" ]] || {
            echo 'Attestation manifest is not linked to the runnable platform manifest.' >&2
            exit 1
          }

          runnable_manifest="$RUNNER_TEMP/platform-image.json"
          docker buildx imagetools inspect --raw "$IMAGE@$image_digest" > "$runnable_manifest"
          jq -e '
            .schemaVersion == 2 and
            .mediaType == "application/vnd.oci.image.manifest.v1+json" and
            (.config.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.layers | length) > 0 and
            all(.layers[]; .digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$runnable_manifest" > /dev/null || {
            echo 'Runnable platform manifest has an unexpected OCI shape:' >&2
            cat "$runnable_manifest" >&2
            exit 1
          }

          docker pull "$IMAGE@$image_digest" > /dev/null
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE@$image_digest")" == "linux/$ARCH" ]] || {
            echo 'Pulled image platform does not match its native architecture job.' >&2
            exit 1
          }
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$image_digest")" == "$COMMIT_SHA" ]] || {
            echo 'Image revision label does not match the verified full commit SHA.' >&2
            exit 1
          }
          [[ "$(docker image inspect --format '{{ index .Config.Labels "global.goldenera.wallet.jar.sha256" }}' "$IMAGE@$image_digest")" == "$EXPECTED_JAR_SHA256" ]] || {
            echo 'Image JAR label does not match the tested JAR digest.' >&2
            exit 1
          }
          [[ "$(docker image inspect --format '{{.Config.User}}' "$IMAGE@$image_digest")" == '10001:10001' ]] || {
            echo 'Image runtime user is not the reviewed non-root identity.' >&2
            exit 1
          }
          [[ "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE@$image_digest")" == '["java","-jar","/app/app.jar"]' ]] || {
            echo 'Image entrypoint differs from the reviewed exec-form Java command.' >&2
            exit 1
          }
          [[ "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE@$image_digest")" == 'null' ]] || {
            echo 'Image must not override the reviewed entrypoint with CMD.' >&2
            exit 1
          }

          container_id="$(docker create "$IMAGE@$image_digest")"
          trap 'docker rm -f "$container_id" > /dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/app.jar" "$RUNNER_TEMP/image-app.jar"
          [[ "$(sha256sum "$RUNNER_TEMP/image-app.jar" | awk '{print $1}')" == "$EXPECTED_JAR_SHA256" ]] || {
            echo 'JAR bytes extracted from the image differ from the tested JAR.' >&2
            exit 1
          }
          docker rm -f "$container_id" > /dev/null
          trap - EXIT

          attestation_manifest="$RUNNER_TEMP/platform-attestations.json"
          docker buildx imagetools inspect --raw "$IMAGE@$attestation_digest" > "$attestation_manifest"
          jq -e '
            .schemaVersion == 2 and
            .mediaType == "application/vnd.oci.image.manifest.v1+json" and
            (.layers | length) == 2 and
            all(.layers[]; .mediaType == "application/vnd.in-toto+json") and
            ([.layers[].annotations["in-toto.io/predicate-type"]] | sort) ==
              ["https://slsa.dev/provenance/v1", "https://spdx.dev/Document"]
          ' "$attestation_manifest" > /dev/null || {
            echo 'Attestation manifest must contain exactly SLSA provenance v1 and SPDX SBOM layers:' >&2
            cat "$attestation_manifest" >&2
            exit 1
          }

          token_response="$RUNNER_TEMP/registry-token.json"
          curl --fail --silent --show-error --retry 3 --get \
            --user "$REGISTRY_USER:$GH_TOKEN" \
            --data-urlencode "service=$REGISTRY_HOST" \
            --data-urlencode "scope=repository:$IMAGE_NAME:pull" \
            "https://$REGISTRY_HOST/token" > "$token_response"
          registry_token="$(jq -er '.token // .access_token' "$token_response")"

          while IFS=$'\t' read -r predicate_type layer_digest; do
            [[ "$layer_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Attestation layer for $predicate_type has a non-canonical digest." >&2
              exit 1
            }
            statement="$RUNNER_TEMP/attestation-${layer_digest#sha256:}.json"
            curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error --retry 3 \
              --header "Authorization: Bearer $registry_token" \
              "https://$REGISTRY_HOST/v2/$IMAGE_NAME/blobs/$layer_digest" > "$statement"
            [[ "$(sha256sum "$statement" | awk '{print $1}')" == "${layer_digest#sha256:}" ]] || {
              echo 'Attestation blob digest verification failed.' >&2
              exit 1
            }
            jq -e --arg predicate "$predicate_type" --arg subject "${image_digest#sha256:}" '
              .predicateType == $predicate and
              any(.subject[]?; .digest.sha256 == $subject)
            ' "$statement" > /dev/null || {
              echo "Attestation statement $predicate_type is not linked to runnable manifest $image_digest." >&2
              exit 1
            }
          done < <(jq -r '.layers[] | [.annotations["in-toto.io/predicate-type"], .digest] | @tsv' "$attestation_manifest")

          metadata_dir="$RUNNER_TEMP/image-metadata"
          mkdir -p "$metadata_dir"
          jq -n \
            --arg architecture "$ARCH" \
            --arg attestation_digest "$attestation_digest" \
            --arg build_digest "$DIGEST" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg image_digest "$image_digest" \
            --arg jar_sha256 "$EXPECTED_JAR_SHA256" \
            --slurpfile root "$root_manifest" \
            '{
              os: "linux",
              architecture: $architecture,
              build_digest: $build_digest,
              image_digest: $image_digest,
              attestation_digest: $attestation_digest,
              runnable_descriptor: ($root[0].manifests[] | select(.digest == $image_digest)),
              attestation_descriptor: ($root[0].manifests[] | select(.digest == $attestation_digest)),
              commit_sha: $commit_sha,
              jar_sha256: $jar_sha256,
              provenance: true,
              sbom: true
            }' > "$metadata_dir/$ARCH.json"

      - name: Upload verified platform metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata-${{ matrix.arch }}-${{ needs.build.outputs.commit_sha }}
          path: ${{ runner.temp }}/image-metadata/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish policy-compliant image aliases
    if: needs.build.outputs.publish_mode != 'none'
    needs:
      - build
      - build-images
    runs-on: ubuntu-24.04
    # Development publishers serialize on the shared mutable :dev alias. Immutable
    # default/version aliases remain isolated by their verified commit identity.
    concurrency:
      group: wallet-image-alias-${{ github.repository }}-${{ needs.build.outputs.publish_mode == 'dev' && 'dev' || needs.build.outputs.commit_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      amd64_image_digest: ${{ steps.publish.outputs.amd64_image_digest }}
      arm64_image_digest: ${{ steps.publish.outputs.arm64_image_digest }}
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified platform metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-metadata-*-${{ needs.build.outputs.commit_sha }}
          path: ${{ runner.temp }}/image-metadata
          merge-multiple: true

      - name: Stage the manifest and publish aliases
        id: publish
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          JAR_SHA256: ${{ needs.build.outputs.jar_sha256 }}
          MODE: ${{ needs.build.outputs.publish_mode }}
          REGISTRY_HOST: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ needs.build.outputs.source_branch }}
          VERSION: ${{ needs.build.outputs.version }}
        run: tools/publish-image-aliases.sh

  release:
    name: Create or verify immutable version release
    if: needs.build.outputs.publish_mode == 'version'
    needs:
      - build
      - publish-images
    runs-on: ubuntu-24.04
    concurrency:
      group: wallet-release-publication-${{ github.repository }}-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallet-jar-${{ needs.build.outputs.commit_sha }}
          path: ${{ runner.temp }}/wallet-release

      - name: Create or exactly verify the release
        shell: bash
        env:
          AMD64_IMAGE_DIGEST: ${{ needs.publish-images.outputs.amd64_image_digest }}
          API_URL: ${{ github.api_url }}
          ARM64_IMAGE_DIGEST: ${{ needs.publish-images.outputs.arm64_image_digest }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          EXPECTED_SHA256: ${{ needs.build.outputs.jar_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          MANIFEST_DIGEST: ${{ needs.publish-images.outputs.manifest_digest }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: tools/publish-github-release.sh
